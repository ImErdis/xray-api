openapi: 3.0.3
info:
  title: xray-api
  description: >-
    Control-plane REST API for managing fleets of Xray-core proxy nodes:
    plans, subscription users, multi-node provisioning, traffic accounting,
    quota enforcement, and subscription-link delivery.
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        data_limit_bytes: { type: integer, nullable: true }
        duration_days: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Node:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        api_address: { type: string }
        api_port: { type: integer }
        api_tls: { type: boolean }
        api_tls_server_name: { type: string }
        api_tls_insecure: { type: boolean }
        api_ca_cert: { type: string, description: "PEM CA pinning the node's server cert" }
        api_client_cert: { type: string, description: "PEM client cert presented for mTLS" }
        api_client_key: { type: string, writeOnly: true, description: "PEM client key; never returned. Omit on PATCH to keep, send empty to clear." }
        api_has_client_key: { type: boolean, readOnly: true }
        status: { type: string, enum: [online, offline, unknown, disabled] }
        last_seen_at: { type: string, format: date-time, nullable: true }
    Inbound:
      type: object
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        tag: { type: string }
        protocol: { type: string, enum: [vless, vmess, trojan, shadowsocks] }
        public_host: { type: string }
        public_port: { type: integer }
        network: { type: string, enum: [tcp, ws, grpc, httpupgrade, xhttp] }
        security: { type: string, enum: [none, tls, reality] }
        method: { type: string, description: "Shadowsocks AEAD cipher (required for protocol=shadowsocks)" }
        xhttp_mode: { type: string, enum: [auto, packet-up, stream-up, stream-one] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, expired, disabled] }
        data_limit_bytes: { type: integer, nullable: true }
        used_upload_bytes: { type: integer }
        used_download_bytes: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        sub_url: { type: string }
paths:
  /system/stats:
    get:
      summary: System overview (node status counts, build info)
      responses: { "200": { description: OK } }
  /nodes:
    get:
      summary: List nodes
      responses: { "200": { description: OK } }
    post:
      summary: Register a node
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Node" } } } }
  /nodes/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Get a node, responses: { "200": { description: OK } } }
    patch: { summary: Update a node, responses: { "200": { description: OK } } }
    delete: { summary: Delete a node, responses: { "204": { description: No Content } } }
  /nodes/{id}/reconcile:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Trigger a reconcile pass, responses: { "202": { description: Accepted } } }
  /nodes/{id}/inbounds:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: List a node's inbounds, responses: { "200": { description: OK } } }
    post:
      summary: Register an inbound on a node
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Inbound" } } } }
  /inbounds/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Get an inbound, responses: { "200": { description: OK } } }
    patch: { summary: Update an inbound, responses: { "200": { description: OK } } }
    delete: { summary: Delete an inbound, responses: { "204": { description: No Content } } }
  /plans:
    get: { summary: List plans, responses: { "200": { description: OK } } }
    post:
      summary: Create a plan
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
  /plans/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Get a plan, responses: { "200": { description: OK } } }
    patch: { summary: Update a plan, responses: { "200": { description: OK } } }
    delete: { summary: Delete a plan, responses: { "204": { description: No Content } } }
  /users:
    get:
      summary: List users
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: plan_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses: { "200": { description: OK } }
    post:
      summary: Provision a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, inbound_ids]
              properties:
                email: { type: string }
                plan_id: { type: string, nullable: true }
                inbound_ids: { type: array, items: { type: string } }
                data_limit_bytes: { type: integer, nullable: true }
                expires_at: { type: string, format: date-time, nullable: true }
                note: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { summary: Get a user, responses: { "200": { description: OK } } }
    patch: { summary: Update a user, responses: { "200": { description: OK } } }
    delete: { summary: Delete a user, responses: { "204": { description: No Content } } }
  /users/{id}/inbounds:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put: { summary: Replace a user's inbound assignments, responses: { "200": { description: OK } } }
  /users/{id}/suspend:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Disable a user (remove from nodes), responses: { "200": { description: OK } } }
  /users/{id}/resume:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Re-enable a user, responses: { "200": { description: OK } } }
  /users/{id}/renew:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Renew a subscription (billing-cycle endpoint)
      description: >-
        Extends expiry (stacking from the current expiry when still in the
        future), optionally resets traffic and/or switches plan, and
        reactivates the user — atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer }
                reset_traffic: { type: boolean }
                plan_id: { type: string, nullable: true }
      responses: { "200": { description: OK } }
  /users/{id}/reset-traffic:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Zero usage and reactivate if quota-suspended, responses: { "200": { description: OK } } }
  /users/{id}/rotate-sub-token:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { summary: Issue a new subscription token, responses: { "200": { description: OK } } }
  /users/{id}/usage:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, schema: { type: string, format: date-time } }
      - { name: to, in: query, schema: { type: string, format: date-time } }
      - { name: group_by, in: query, schema: { type: string, enum: [day, node] } }
    get: { summary: Aggregated traffic usage, responses: { "200": { description: OK } } }
  /webhooks/billing:
    post:
      summary: Billing webhook (public, HMAC-signed)
      description: >-
        Provider-agnostic billing lifecycle endpoint. Authenticated by hex
        HMAC-SHA256 of the raw body in X-Webhook-Signature (not by API key).
        Replay-safe via event_id; provisioning is idempotent on external_id.
        See docs/billing-webhooks.md. Served at /webhooks/billing (no /api/v1
        prefix).
      security: []
      parameters:
        - { name: X-Webhook-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, action]
              properties:
                event_id: { type: string }
                action: { type: string, enum: [provision, renew, suspend, resume, cancel] }
                external_id: { type: string }
                email: { type: string }
                provision:
                  type: object
                  properties:
                    email: { type: string }
                    plan_id: { type: string, nullable: true }
                    inbound_ids: { type: array, items: { type: string } }
                    data_limit_bytes: { type: integer, nullable: true }
                    expires_at: { type: string, format: date-time, nullable: true }
                    note: { type: string }
                renew:
                  type: object
                  properties:
                    days: { type: integer }
                    reset_traffic: { type: boolean }
                    plan_id: { type: string, nullable: true }
      responses:
        "200": { description: Processed (or acknowledged duplicate) }
        "401": { description: Invalid signature }
  /api-keys:
    get: { summary: List API keys, responses: { "200": { description: OK } } }
    post: { summary: Create an API key (plaintext returned once), responses: { "201": { description: Created } } }
  /api-keys/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete: { summary: Revoke an API key, responses: { "204": { description: No Content } } }
