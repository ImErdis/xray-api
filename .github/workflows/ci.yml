name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xray
          POSTGRES_PASSWORD: xray
          POSTGRES_DB: xray_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_DSN: postgres://xray:xray@localhost:5432/xray_api_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: Verify formatting
        run: test -z "$(gofmt -l internal cmd)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
